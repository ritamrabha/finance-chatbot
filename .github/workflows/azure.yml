name: Build and Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & Build Vue.js
        run: |
          npm install
          npm run build
          ls -la dist/

      - name: Prepare production package
        run: |
          mkdir -p deploy_pkg
          cp server.py deploy_pkg/
          cp -r dist deploy_pkg/
          ls -la deploy_pkg

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'finsight-ai-ritam'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './deploy_pkg'
