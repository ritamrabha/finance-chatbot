name: Build and Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & Build Vue.js
        run: |
          set +e
          echo "=== Node & NPM ===" > build.log
          node -v >> build.log 2>&1
          npm -v >> build.log 2>&1
          echo "=== NPM INSTALL ===" >> build.log
          npm install >> build.log 2>&1
          INSTALL_EXIT=$?
          echo "npm install exit code: $INSTALL_EXIT" >> build.log
          echo "=== NPM BUILD ===" >> build.log
          npm run build >> build.log 2>&1
          BUILD_EXIT=$?
          echo "npm run build exit code: $BUILD_EXIT" >> build.log
          echo "=== BUILD LOG SUMMARY ==="
          cat build.log
          python3 -c "
content = open('build.log').read()
encoded = content.replace('\r', '').replace('\n', '%0A')
print('::error title=DiagnosticLog::' + encoded[:4000])
"
          if [ $INSTALL_EXIT -ne 0 ] || [ $BUILD_EXIT -ne 0 ]; then
            exit 1
          fi
          ls -la dist/

      - name: Prepare production package
        run: |
          mkdir -p deploy_pkg
          cp server.py deploy_pkg/
          cp -r dist deploy_pkg/
          ls -la deploy_pkg

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'finsight-ai-ritam'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './deploy_pkg'
